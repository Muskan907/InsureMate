services:

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: insuremate-backend
    ports:
      - "8000:8000"
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434/api  
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: insuremate-frontend
    ports:
      - "5173:80"
    restart: unless-stopped